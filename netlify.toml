# Netlify: static site from /public + the Express API as a serverless function.

[build]
  publish = "public"
  functions = "netlify/functions"
  command = "echo 'no build step'"

[build.environment]
  NODE_VERSION = "20"

[functions]
  # site.config.json is read at runtime, so ship it with the function.
  included_files = ["config/**"]

# /api/* → Express app inside the function
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/:splat"
  status = 200
  force = true

# Static assets: cache in browsers for an hour
[[headers]]
  for = "/js/*"
  [headers.values]
    Cache-Control = "public, max-age=3600"

[[headers]]
  for = "/css/*"
  [headers.values]
    Cache-Control = "public, max-age=3600"
